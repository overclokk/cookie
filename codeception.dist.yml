namespace: Overclokk\Cookie\Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/.output
    data: tests/.data
    support: tests/src/Support
    envs: tests/.envs
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed
coverage:
  enabled: true
  include:
    - src/*
settings:
  shuffle: true
